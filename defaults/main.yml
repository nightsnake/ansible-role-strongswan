---
strongswan_letsencrypt_enable: true

strongswan_apparmor_enabled: false
strongswan_swanctl_root_dir: "/etc/swanctl"
strongswan_swanctl_config_dir: "{{ strongswan_swanctl_root_dir }}/conf.d"
strongswan_swanctl_scripts_dir: "{{ strongswan_swanctl_root_dir }}/scripts"
strongswan_conf_file: "/etc/strongswan.conf"
strongswan_swanctl_config_file: "{{ strongswan_swanctl_config_dir }}/swanctl.conf"
strongswan_swanctl_updown_file: "{{ strongswan_swanctl_scripts_dir }}/updown.sh"
strongswan_key_file: "{{ hostname }}.key"
strongswan_cert_file: "{{ hostname }}.pem"
strongswan_ipsec_if: "eth0"
strongswan_vti_if: "vti-${PLUTO_IF_ID_OUT}"

# Оптимизированный набор плагинов для site-to-site с сертификатами
strongswan_module_settings:
  swanctl:
    load: "pem x509 pubkey openssl random vici"
  charon:
    load: "random nonce aesni aes sha1 sha2 md5 gcm hmac kdf vici kernel-netlink socket-default connmark updown x509 revocation constraints pubkey pkcs1 pkcs8 pem openssl gmp"
    dpd_delay: "60"
    dpd_action: "restart"
    retransmit_timeout: "4"
    retransmit_tries: "5"
    mobike: "no"

# Включение конфигурации отдельных плагинов
strongswan_plugins_config: {}
# Пример:
# strongswan_plugins_config:
#   bypass-lan:
#     interfaces_use: eth0
#     # other options...

# Настройки по умолчанию для всех соединений
strongswan_connection_defaults:
  version: 2
  fragmentation: "yes"
  mobike: "no"
  rekey_time: 0s
  dpd_delay: 60s
  send_cert: always
  proposals: chacha20poly1305-sha512-curve25519-prfsha512,aes256gcm16-sha384-prfsha384-ecp384
  local:
    auth: pubkey
  remote:
    auth: pubkey
  children_defaults:
    start_action: start
    dpd_action: restart
    rekey_time: 0s
    esp_proposals: chacha20poly1305-sha512,aes256gcm16-ecp384,aes256-sha256

# Список соединений (должен быть переопределен)
strongswan_conn_list: []

# Отключение устаревшего демона
strongswan_disable_starter: true

skip_apparmor_selinux: true

strongswan_package_list: 
  - strongswan-swanctl 
  - strongswan-pki 
  - charon-systemd 
  - libstrongswan-standard-plugins 
  - libstrongswan-extra-plugins 
  - libcharon-extra-plugins 
  - strongswan 
